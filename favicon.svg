<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cq-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B1020"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#cq-grad)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Shield/Hexagon Base -->
  <polygon points="32,10 52,20 52,44 32,54 12,44 12,20" fill="#141B2D" stroke="url(#cq-grad)" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Code Brackets { } -->
  <path d="M26,22 C23,22 22,24 22,27 C22,29 20,31 18,32 C20,33 22,35 22,37 C22,40 23,42 26,42" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38,22 C41,22 42,24 42,27 C42,29 44,31 46,32 C44,33 42,35 42,37 C42,40 41,42 38,42" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Quest Gem / Star in Center -->
  <polygon points="32,26 34.5,30.5 39,32 34.5,33.5 32,38 29.5,33.5 25,32 29.5,30.5" fill="url(#cq-glow)"/>
</svg>
